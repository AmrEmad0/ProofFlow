<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9fafb" />
    <meta name="description" content="Visual AI for your workflow. ProofFlow helps small businesses and individuals define visual checks and review video evidence without custom model training." />
    <title>ProofFlow — Visual AI for your workflow</title>
    <script>
      try {
        if (localStorage.getItem("proofflow.theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#171717");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
