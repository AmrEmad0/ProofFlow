services:
  proofflow:
    image: proofflow:local
    build: .
    pull_policy: build
    ports:
      - "${PROOFFLOW_BIND_IP:-127.0.0.1}:${PROOFFLOW_HTTP_PORT:-3100}:3000"
    environment:
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      META_API_BASE_URL: ${META_API_BASE_URL:-https://api.meta.ai/v1}
      WEB_ORIGIN: ${WEB_ORIGIN:-https://proofflow.amremad.com}
      DEMO_VIDEO_PATH: /app/data/demos
      CAMERA_SOURCES: '${CAMERA_SOURCES:-{}}'
    volumes:
      - proofflow-data:/app/data
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - 'const response = await fetch("http://127.0.0.1:3000/api/health"); process.exit(response.ok ? 0 : 1)'
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 60s

volumes:
  proofflow-data:
